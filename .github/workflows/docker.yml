name: docker

on:
  push:
    branches: [main]
  workflow_dispatch:

# One deploy at a time; a newer push waits instead of racing the older one
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGE_PREFIX: ghcr.io/${{ github.repository }}
  DOMAIN: maitinh-nguyenhanh.love

jobs:
  # The api builds with SWC, which does not type-check: this job is the gate.
  # Runs beside `build`, so it adds no time unless it fails.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      # Turbo's local cache (.turbo/cache); unchanged packages replay their logs
      - uses: actions/cache@v6
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-

      - run: pnpm install --frozen-lockfile

      - run: pnpm turbo run lint check-types test

  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # package: the workspace whose changes (turbo follows its dependencies)
        # need a new image; paths: files outside any package that do too (this
        # workflow included: build-args and targets live here)
        include:
          - image: api
            file: api
            target: runner
            package: api
            paths: deploy/api.Dockerfile .dockerignore .github/workflows/docker.yml
          - image: migrate
            file: api
            target: migrate
            package: '@repo/db'
            paths: deploy/api.Dockerfile .dockerignore pnpm-workspace.yaml .github/workflows/docker.yml
          - image: web
            file: web
            target: runner
            package: web
            paths: deploy/web.Dockerfile .dockerignore .github/workflows/docker.yml
    steps:
      # Blobless full history: `turbo query affected` needs the base commit
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: blob:none

      # Unchanged image → retag the previous release's one instead of building.
      # Builds anyway on manual runs, a first push, or when the base is unknown
      - id: affected
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          build=true
          if [ "${{ github.event_name }}" = push ] && [ -n "$BEFORE" ] \
            && git cat-file -e "$BEFORE^{commit}" 2>/dev/null \
            && git diff --quiet "$BEFORE" HEAD -- ${{ matrix.paths }}; then
            v=$(sed -n "s/^  'turbo': //p" pnpm-workspace.yaml)
            # Exit 0: nothing affected, 1: affected, 2: error (→ build)
            if npx -y "turbo@$v" query affected --base "$BEFORE" --head HEAD \
              --packages '${{ matrix.package }}' --exit-code; then
              build=false
            fi
          fi
          echo "build=$build" | tee -a "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_PREFIX }}-${{ matrix.image }}
          # Full-length sha: the deploy job pulls sha-${{ github.sha }}
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      # Point this release's tags at the previous release's image (no pull or
      # push of layers). If that image is missing, fall through to a build
      - id: retag
        if: steps.affected.outputs.build == 'false'
        continue-on-error: true
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          img="$IMAGE_PREFIX-${{ matrix.image }}"
          docker buildx imagetools create \
            -t "$img:sha-$GITHUB_SHA" -t "$img:latest" "$img:sha-$BEFORE"

      - if: steps.affected.outputs.build == 'true' || steps.retag.outcome == 'failure'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/${{ matrix.file }}.Dockerfile
          target: ${{ matrix.target }}
          build-args: |
            NEXT_PUBLIC_API_URL=https://api.${{ env.DOMAIN }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.file }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  deploy:
    needs: [check, build]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://${{ env.DOMAIN }}
    env:
      TAG: sha-${{ github.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: deploy

      - name: Set up SSH
        run: |
          install -m 700 -d ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      - name: Upload compose files
        run: |
          scp deploy/docker-compose.prod.yml deploy/Caddyfile \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/root/wedding/"

      - name: Pull, migrate and restart
        run: |
          # The job token can read this repo's packages; it is only used for
          # this pull and expires when the job ends.
          ssh "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            TAG='${{ env.TAG }}' IMAGE_PREFIX='${{ env.IMAGE_PREFIX }}' \
            GHCR_USER='${{ github.actor }}' GHCR_TOKEN='${{ secrets.GITHUB_TOKEN }}' \
            bash -s <<'EOF'
          set -euo pipefail
          cd /root/wedding
          # docker-compose.override.yml is server-only (never uploaded), for
          # host-specific tweaks such as publishing ports
          C="docker compose -p wedding -f docker-compose.prod.yml --env-file .env.prod"
          [ -f docker-compose.override.yml ] && C="$C -f docker-compose.override.yml"
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
          # Every release is a new sha tag; drop the ones no container uses
          # (all re-pullable from ghcr) or the small disk fills up
          docker image prune -af >/dev/null
          $C --profile tools pull --quiet api web migrate
          docker logout ghcr.io
          # -T and </dev/null: this script itself arrives on stdin (bash -s);
          # without them `run` swallows the remaining lines and `up` never runs
          $C run --rm -T migrate </dev/null
          $C up -d --remove-orphans
          # Caddyfile is a bind mount: pick up changes uploaded above
          $C exec -T caddy caddy reload --config /etc/caddy/Caddyfile </dev/null
          # Remember the release so a manual `up -d` keeps running it
          sed -i "s|^IMAGE_PREFIX=.*|IMAGE_PREFIX=$IMAGE_PREFIX|; s|^TAG=.*|TAG=$TAG|" .env.prod
          grep -q '^IMAGE_PREFIX=' .env.prod || echo "IMAGE_PREFIX=$IMAGE_PREFIX" >> .env.prod
          docker image prune -af >/dev/null
          EOF

      - name: Smoke test
        run: |
          for url in "https://${DOMAIN}/" "https://api.${DOMAIN}/public/wedding"; do
            for i in $(seq 1 20); do
              code=$(curl -s -o /dev/null -w '%{http_code}' "$url" || true)
              [ "$code" = 200 ] && echo "$url -> 200" && continue 2
              sleep 3
            done
            echo "$url failed (last status $code)"; exit 1
          done
