packages:
  - 'apps/*'
  - 'packages/*'
  - 'packages/tooling/*'

resolvePeersFromWorkspaceRoot: false
dedupePeerDependents: false

# Shared versions: one flat list, referenced as `"<pkg>": "catalog:"`.
catalog:
  # Dev tooling (TS 7 has no compiler API yet: Nest CLI and typescript-eslint need it)
  'typescript': 6.0.3
  'eslint': 10.9.1
  '@types/node': 26.4.1
  'tsx': 4.23.13
  'turbo': 2.11.7
  'eslint-plugin-turbo': 2.11.7

  # NestJS: all @nestjs/* move together
  '@nestjs/common': 12.1.2
  '@nestjs/core': 12.1.2
  '@nestjs/platform-express': 12.1.2
  'class-transformer': 0.5.1
  'class-validator': 0.15.1
  'reflect-metadata': 0.2.2
  'rxjs': 7.8.2

  # Prisma: client, CLI and generator helper move together
  '@prisma/client': 7.10.0
  '@prisma/adapter-pg': 7.10.0
  '@prisma/generator-helper': 7.10.0
  'prisma': 7.10.0

  # React: one version for web and ui
  'react': 19.2.8
  'react-dom': 19.2.8
  '@types/react': 19.2.18
  '@types/react-dom': 19.2.5

  # Next and its lint plugin move together
  'next': 16.4.4
  '@next/eslint-plugin-next': 16.4.4

  # Tailwind v4 for web and ui
  'tailwindcss': 4.3.3
  '@tailwindcss/postcss': 4.3.3

  # Libraries shared by several workspaces
  'bcryptjs': 3.0.3
  'dotenv': 18.0.6
  'lucide-react': 1.54.0
  'motion': 12.43.0
  'recharts': 3.8.0

allowBuilds:
  '@prisma/engines': true
  '@swc/core': true
  'esbuild': true
  'prisma': true
