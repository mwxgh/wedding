# Production stack for a single small VPS (1 vCPU / 2 GB): PostgreSQL, RustFS,
# api, web and Caddy (automatic HTTPS). Redis is left out.
# Apps share one Postgres user/database; each lives in its own schema
# (POSTGRES_SCHEMA), so a second project can reuse the same account.
# Usage (on the server, in the deploy directory):
#   cp .env.prod.example .env.prod   # fill it in
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d

x-common: &common
  restart: unless-stopped
  logging:
    driver: json-file
    options: { max-size: '10m', max-file: '3' }

services:
  postgres:
    <<: *common
    image: postgres:${POSTGRES_VERSION:-17-alpine}
    mem_limit: 384m
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
      TZ: Asia/Ho_Chi_Minh
    command:
      - postgres
      - -c
      - shared_buffers=64MB
      - -c
      - max_connections=50
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  rustfs:
    <<: *common
    image: rustfs/rustfs:${RUSTFS_VERSION:-latest}
    mem_limit: 256m
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:?required}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:?required}
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: ':9000'
      RUSTFS_CONSOLE_ENABLE: 'false'
      TZ: Asia/Ho_Chi_Minh
    volumes:
      - rustfs-data:/data

  api:
    <<: *common
    image: ${IMAGE_PREFIX:-wedding}-api:${TAG:-latest}
    mem_limit: 320m
    depends_on:
      postgres: { condition: service_healthy }
      rustfs: { condition: service_started }
    environment:
      PORT: 3001
      WEB_ORIGIN: https://${DOMAIN:?required}
      PUBLIC_SITE_URL: https://${DOMAIN}
      DATABASE_URL: &database-url postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-postgres}?schema=${POSTGRES_SCHEMA:-wedding}
      JWT_SECRET: ${JWT_SECRET:?required}
      JWT_EXPIRES_IN: 7d
      # Presigned photo URLs must point at the public host; requests from the
      # api reach it through Caddy on this machine (see extra_hosts).
      S3_ENDPOINT: https://s3.${DOMAIN}
      S3_REGION: us-east-1
      S3_ACCESS_KEY: ${RUSTFS_ACCESS_KEY}
      S3_SECRET_KEY: ${RUSTFS_SECRET_KEY}
      S3_BUCKET: wedding
      UPLOAD_MAX_MB: 15
      SETTINGS_SECRET: ${SETTINGS_SECRET:?required}
      PAYOS_TTL_MINUTES: 15
      NODE_OPTIONS: --max-old-space-size=256
    extra_hosts:
      - s3.${DOMAIN}:host-gateway

  web:
    <<: *common
    image: ${IMAGE_PREFIX:-wedding}-web:${TAG:-latest}
    mem_limit: 320m
    depends_on: [api]
    environment:
      # Server-side calls go straight to the api container
      API_URL: http://api:3001
      NODE_OPTIONS: --max-old-space-size=256

  # Syncs the Prisma schema to the database (`prisma db push`), then exits:
  #   docker compose ... run --rm migrate
  migrate:
    image: ${IMAGE_PREFIX:-wedding}-migrate:${TAG:-latest}
    profiles: [tools]
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      DATABASE_URL: *database-url

  caddy:
    <<: *common
    image: caddy:2-alpine
    mem_limit: 96m
    depends_on: [web, api, rustfs]
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  postgres-data:
  rustfs-data:
  caddy-data:
  caddy-config:
